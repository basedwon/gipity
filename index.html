<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gipity4</title>
  <meta name="description" content="Gipity4 is coming soon.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --surface: rgba(11, 18, 28, .68);
      --mint: #54e7b8;
      --blue: #5da9ff;
      --text: #eaf7f2;
      --soft: rgba(234, 247, 242, .72);
      --line: rgba(84, 231, 184, .24);
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      min-height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 22% 18%, rgba(84, 231, 184, .18), transparent 31%),
        radial-gradient(circle at 78% 24%, rgba(93, 169, 255, .16), transparent 34%),
        linear-gradient(135deg, #05070d 0%, #07111a 48%, #05070d 100%);
      overflow: hidden;
    }
    .shell {
      width: min(620px, 100%);
      padding: clamp(28px, 7vw, 56px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35), 0 0 52px rgba(84, 231, 184, .08);
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--soft);
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 12vw, 104px);
      line-height: .92;
      letter-spacing: -.08em;
      color: var(--mint);
      text-shadow: 0 0 34px rgba(84, 231, 184, .28);
    }
    .soon {
      margin: 18px 0 0;
      color: var(--soft);
      font-size: clamp(18px, 4vw, 24px);
    }
    .line {
      width: 76px;
      height: 3px;
      margin: 28px auto 0;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--mint), transparent);
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Gipity4 coming soon">
    <!-- <p class="eyebrow">Number 4 alive</p> -->
    <h1>Gipity4</h1>
    <p class="soon">Coming soon.</p>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
